<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwohaji - 뭐하지...</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <button id="global-settings-btn" class="global-settings-btn" title="설정"></button>
    <button id="timer-btn" class="global-settings-btn timer-toggle-btn" title="타이머/스톱워치" style="left: 32px; top: 20px; right: auto;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"></path></svg></button>
    <button id="ai-chat-toggle-btn" class="global-settings-btn ai-chat-toggle-btn" title="AI 대화" style="left: 32px; top: 80px; right: auto;"></button>
    <div id="app">
        <header class="header">
            <div class="header-left">
                <button id="settings-btn" class="icon-btn" title="카테고리 관리"></button>
            </div>
            <div class="view-toggle">
                <button id="view-project" class="active">카테고리별 보기</button>
                <button id="view-all">전체 보기</button>
            </div>
            <div class="header-right">
                <div id="current-time" class="current-time" title="현재 시간"></div>
                <button id="audio-status-btn" class="icon-btn" title="소리 상태 확인"></button>
                <div class="data-management">
                    <button id="import-btn" title="가져오기"></button>
                    <button id="export-btn" title="내보내기"></button>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="todo-input-container">
                <div class="input-row">
                    <textarea id="todo-input" placeholder="새로운 할 일을 추가하세요... (마크다운 지원: **굵게**, *기울임*, `코드`, [링크](URL), ![이미지](URL){width=300 height=200})&#10;Enter: 할일 추가, Shift+Enter: 줄바꿈" rows="3"></textarea>
                    <button id="add-todo-btn">추가</button>
                </div>
                <div id="category-selector" class="category-selector">
                    <!-- 카테고리 버튼들이 동적으로 추가됩니다. -->
                </div>
            </div>
            <div id="todo-list" class="todo-list">
                <!-- 할 일 목록이 여기에 동적으로 추가됩니다. -->
            </div>
        </main>
    </div>

    <!-- 카테고리 관리 모달 -->
    <div id="category-modal" class="modal-wrapper" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>카테고리 관리</h2>
                <div class="modal-header-actions">
                    <button id="edit-category-order-btn" class="icon-btn" title="순서 편집"></button>
                    <button id="close-modal-btn" class="icon-btn"></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="category-input-container">
                    <input type="text" id="new-category-input" placeholder="새 카테고리 이름">
                    <button id="add-category-btn">카테고리 추가</button>
                </div>

                <ul id="category-list" class="category-manage-list">
                    <!-- 카테고리 목록이 동적으로 추가됩니다. -->
                </ul>
            </div>
        </div>
    </div>

    <!-- 카테고리 삭제 확인 모달 -->
    <div id="category-delete-modal" class="modal-wrapper" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>카테고리 삭제</h2>
                <button id="close-category-delete-modal-btn" class="icon-btn"></button>
            </div>
            <div class="modal-body">
                <p id="category-delete-message" class="delete-message"></p>
                <div class="delete-options">
                    <h3>해당 카테고리의 할 일을 어떻게 처리하시겠습니까?</h3>
                    <div class="option-group">
                        <label class="option-item">
                            <input type="radio" name="delete-option" value="move-to-default" checked>
                            <span class="option-text">
                                <strong>일반 카테고리로 이동</strong>
                                <small>모든 할 일을 '일반' 카테고리로 변경합니다.</small>
                            </span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="delete-option" value="move-to-other">
                            <span class="option-text">
                                <strong>다른 카테고리로 이동</strong>
                                <small>선택한 카테고리로 모든 할 일을 이동합니다.</small>
                            </span>
                        </label>
                        <div id="other-category-select" class="other-category-select" style="display: none;">
                            <select id="target-category-select">
                                <!-- 다른 카테고리 옵션들이 동적으로 추가됩니다 -->
                            </select>
                        </div>
                        <label class="option-item">
                            <input type="radio" name="delete-option" value="delete-all">
                            <span class="option-text">
                                <strong>모든 할 일 삭제</strong>
                                <small>해당 카테고리의 모든 할 일을 함께 삭제합니다.</small>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="confirm-category-delete-btn" class="danger-btn">삭제</button>
                    <button id="cancel-category-delete-btn" class="secondary-btn">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 카테고리 편집 모달 -->
    <div id="category-edit-modal" class="modal-wrapper" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>카테고리 편집</h2>
                <button id="close-category-edit-modal-btn" class="icon-btn"></button>
            </div>
            <div class="modal-body">
                <div class="edit-row">
                    <label for="edit-category-name">카테고리 이름:</label>
                    <input type="text" id="edit-category-name" class="edit-input-field" placeholder="새 카테고리 이름을 입력하세요">
                </div>
                <div class="modal-actions">
                    <button id="save-category-edit-btn" class="primary-btn">저장</button>
                    <button id="cancel-category-edit-btn" class="secondary-btn">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 카테고리 순서 편집 모달 -->
    <div id="category-order-modal" class="modal-wrapper" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>카테고리 순서 편집</h2>
                <button id="close-category-order-modal-btn" class="icon-btn"></button>
            </div>
                            <div class="modal-body">
                    <div class="order-controls">
                        <div class="sort-options">
                            <label for="sort-select">정렬 방식:</label>
                            <select id="sort-select" class="sort-select">
                                <option value="custom">사용자 정의 순서</option>
                                <option value="name">이름순 (가나다순)</option>
                                <option value="created">생성 날짜순 (최신순)</option>
                                <option value="created-asc">생성 날짜순 (오래된순)</option>
                            </select>
                            <button id="apply-sort-btn" class="secondary-btn">적용</button>
                        </div>
                    </div>
                    <p class="order-instruction">드래그하여 카테고리 순서를 변경하세요. '일반' 카테고리는 항상 맨 위에 고정됩니다.</p>
                    <ul id="category-order-list" class="category-order-list">
                        <!-- 카테고리 순서 목록이 동적으로 추가됩니다 -->
                    </ul>
                <div class="modal-actions">
                    <button id="save-category-order-btn" class="primary-btn">저장</button>
                    <button id="cancel-category-order-btn" class="secondary-btn">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 일정 설정 모달 -->
    <div id="schedule-modal" class="modal-wrapper" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>할 일 편집</h2>
                <button id="close-schedule-modal-btn" class="icon-btn"></button>
            </div>
            <div class="modal-body">
                <div class="todo-edit-section">
                    <div class="edit-row">
                        <label for="edit-todo-text">할 일 내용:</label>
                        <textarea id="edit-todo-text" class="edit-input-field" rows="3" placeholder="할 일 내용을 입력하세요..."></textarea>
                    </div>
                    <div class="edit-row">
                        <label for="edit-todo-category">카테고리:</label>
                        <select id="edit-todo-category" class="edit-select-field">
                            <!-- 카테고리 옵션들이 동적으로 추가됩니다 -->
                        </select>
                    </div>
                </div>
                
                <!-- 시작 시간 설정 영역 -->
                <div class="schedule-section">
                    <div class="schedule-checkbox-row">
                        <input type="checkbox" id="start-time-enabled">
                        <label for="start-time-enabled" class="schedule-label">시작 시간 설정</label>
                    </div>
                    <div class="schedule-inputs" id="start-time-inputs">
                        <div class="datetime-row">
                            <input type="date" id="start-date" class="date-input">
                            <input type="time" id="start-time" class="time-input">
                        </div>
                        <div class="notification-row">
                            <span class="notification-label">알림 모달:</span>
                            <button id="start-modal-btn" class="notification-toggle-btn icon-btn" data-enabled="true"></button>
                            <span class="notification-label">알림 소리:</span>
                            <button id="start-notification-btn" class="notification-toggle-btn icon-btn" data-enabled="true"></button>
                        </div>
                    </div>
                </div>

                <!-- 마감 시간 설정 영역 -->
                <div class="schedule-section">
                    <div class="schedule-checkbox-row">
                        <input type="checkbox" id="due-time-enabled">
                        <label for="due-time-enabled" class="schedule-label">마감 시간 설정</label>
                    </div>
                    <div class="schedule-inputs" id="due-time-inputs">
                        <div class="datetime-row">
                            <input type="date" id="due-date" class="date-input">
                            <input type="time" id="due-time" class="time-input">
                        </div>
                        <div class="notification-row">
                            <span class="notification-label">알림 모달:</span>
                            <button id="due-modal-btn" class="notification-toggle-btn icon-btn" data-enabled="true"></button>
                            <span class="notification-label">알림 소리:</span>
                            <button id="due-notification-btn" class="notification-toggle-btn icon-btn" data-enabled="true"></button>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="save-schedule-btn" class="primary-btn">저장</button>
                    <button id="cancel-schedule-btn" class="secondary-btn">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 설정 사이드바 오버레이 -->
    <div class="settings-sidebar-overlay" style="display:none;"></div>
    <!-- 설정 사이드바 -->
    <div id="settings-sidebar" class="settings-sidebar" style="display:none;">
        <div class="settings-sidebar-content">
            <button id="close-settings-sidebar" class="icon-btn" title="닫기" style="float:right;margin:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h2 style="margin-top:40px;">설정</h2>
            
            <!-- 설정 항목들이 JavaScript에서 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- AI 대화 사이드바 오버레이 -->
    <div class="ai-chat-sidebar-overlay" style="display:none;"></div>
    <!-- AI 대화 사이드바 -->
    <div id="ai-chat-sidebar" class="ai-chat-sidebar" style="display:none;">
        <div class="ai-chat-sidebar-content">
            <div class="ai-chat-header">
                <h2>AI 대화</h2>
                <button id="close-ai-chat-sidebar" class="icon-btn" title="닫기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="ai-chat-messages" id="ai-chat-messages">
                <!-- 대화 메시지들이 여기에 동적으로 추가됩니다 -->
            </div>
            
            <div class="ai-chat-input-container">
                <textarea id="ai-chat-input" placeholder="할 일이나 일정에 대해 말씀해주세요... (예: 오늘 3시에 회의 준비 알림 설정)" rows="3"></textarea>
                <button id="ai-chat-send-btn" class="ai-chat-send-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22,2 15,22 11,13 2,9"></polygon>
                    </svg>
                </button>
            </div>
            
            <div class="ai-chat-status" id="ai-chat-status">
                <span class="status-text">대화 준비됨</span>
            </div>
        </div>
    </div>

    <!-- 타이머 사이드바 오버레이 (HTML-first로 이동) -->
    <div class="settings-sidebar-overlay timer-sidebar-overlay" style="display:none; opacity:0;"></div>
    <!-- 타이머 / 스톱워치 사이드바 (HTML-first로 이동) -->
    <div id="timer-sidebar" class="settings-sidebar timer-sidebar" style="display:none; position:fixed; top:0; left:-360px; width:360px; height:100vh; background:#fff; box-shadow:-2px 0 16px rgba(0,0,0,0.08); z-index:2001; transform:translateX(0); transition:left 0.3s cubic-bezier(.4,0,.2,1);">
        <div class="settings-sidebar-content">
            <button id="close-timer-sidebar" class="icon-btn" title="닫기" style="float:right;margin:8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 style="margin-top:40px;">타이머 / 스톱워치</h2>

            <!-- 탭 네비게이션 -->
            <div class="tab-navigation" style="display:flex;border-radius:6px;overflow:hidden;margin:20px 0;background:#f3f4f6;padding:4px;">
                <button id="stopwatch-tab" class="tab-button active" style="flex:1;padding:10px;background-color:#1a1a1a;color:#fff;border:none;cursor:pointer;transition:all 0.2s ease;border-radius:4px;font-size:14px;font-weight:500;">
                    <div style="display:flex;align-items:center;justify-content:center;gap:5px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="6" x2="12" y2="12"></line>
                            <line x1="12" y1="12" x2="16" y2="14"></line>
                        </svg>
                        스톱워치
                    </div>
                </button>
                <button id="timer-tab" class="tab-button inactive" style="flex:1;padding:10px;background-color:transparent;color:#6b7280;border:none;cursor:pointer;transition:all 0.2s ease;border-radius:4px;font-size:14px;">
                    <div style="display:flex;align-items:center;justify-content:center;gap:5px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2h12v6l-4 4 4 4v6H6v-6l4-4-4-4V2z"></path>
                        </svg>
                        타이머
                    </div>
                </button>
            </div>

            <!-- 스톱워치 컨텐츠 -->
            <div id="stopwatch-content" class="tab-content" style="display:flex;flex-direction:column;height:calc(100vh - 300px);">
                <div class="time-display" style="text-align:center;margin:20px 0;font-size:42px;font-family:'Courier New',monospace;font-weight:300;color:#1a1a1a;">
                    <span id="stopwatch-display">00:00.00</span>
                </div>
                <div class="controls" style="display:flex;gap:10px;margin:20px 0;">
                    <button id="stopwatch-start-stop" style="flex:1;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:600;transition:all 0.2s ease;">시작</button>
                    <button id="stopwatch-reset" style="flex:1;padding:12px;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:600;transition:all 0.2s ease;">리셋</button>
                </div>
                <div id="lap-container" style="flex-grow:1;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px;background:#fff;">
                    <ul id="lap-times" style="list-style:none;padding:0;margin:0;"></ul>
                </div>
            </div>

            <!-- 타이머 컨텐츠 -->
            <div id="timer-content" class="tab-content" style="display:none;flex-direction:column;height:calc(100vh - 300px);">
                <div class="timer-setup" style="margin-bottom:20px;">
                    <div class="timer-input-group" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:15px;">
                        <input id="timer-hours" type="number" min="0" max="23" value="0" class="timer-input" style="width:60px;padding:8px;border:2px solid #d1d5db;border-radius:6px;text-align:center;font-size:16px;font-family:'Courier New',monospace;">
                        <span class="timer-separator" style="font-size:20px;font-weight:bold;color:#6b7280;">:</span>
                        <input id="timer-minutes" type="number" min="0" max="59" value="0" class="timer-input" style="width:60px;padding:8px;border:2px solid #d1d5db;border-radius:6px;text-align:center;font-size:16px;font-family:'Courier New',monospace;">
                        <span class="timer-separator" style="font-size:20px;font-weight:bold;color:#6b7280;">:</span>
                        <input id="timer-seconds" type="number" min="0" max="59" value="0" class="timer-input" style="width:60px;padding:8px;border:2px solid #d1d5db;border-radius:6px;text-align:center;font-size:16px;font-family:'Courier New',monospace;">
                    </div>
                    <div class="preset-buttons" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:15px;">
                        <button class="timer-preset" data-minutes="1" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">1분</button>
                        <button class="timer-preset" data-minutes="3" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">3분</button>
                        <button class="timer-preset" data-minutes="5" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">5분</button>
                        <button class="timer-preset" data-minutes="10" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">10분</button>
                        <button class="timer-preset" data-minutes="30" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">30분</button>
                        <button class="timer-preset" data-hours="1" style="padding:8px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s ease;">1시간</button>
                    </div>
                </div>
                <div class="time-display" style="text-align:center;margin:20px 0;font-size:42px;font-family:'Courier New',monospace;font-weight:300;color:#1a1a1a;">
                    <span id="timer-display">00:00:00</span>
                </div>
                <div class="controls" style="display:flex;gap:10px;margin:20px 0;">
                    <button id="timer-start-stop" style="flex:1;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:600;transition:all 0.2s ease;">시작</button>
                    <button id="timer-reset" style="flex:1;padding:12px;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:600;transition:all 0.2s ease;">리셋</button>
                </div>
                <div style="flex-grow:1;"></div>
            </div>
        </div>
    </div>
    <!-- 미니 타이머 (플로팅) -->
    <div class="mini-timer" id="mini-timer" style="display:none;">00:00:00</div>

    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/todoManager.js"></script>
    <script src="js/fileHandler.js"></script>
    <script src="js/serviceWorkerManager.js"></script>
    <script src="js/notificationScheduler.js"></script>
    <script src="js/geminiApi.js"></script>
    <script src="js/aiChat.js"></script>
    <script src="js/timer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
